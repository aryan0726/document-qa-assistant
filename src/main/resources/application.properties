# =========================================================
# Application
# =========================================================

spring.application.name=document-qa-assistant

# =========================================================
# Timezone
# =========================================================

spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# =========================================================
# PostgreSQL
# =========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/document_qa}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / Hibernate
# =========================================================

# Database schema is managed by Flyway
spring.jpa.hibernate.ddl-auto=none

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# =========================================================
# Flyway
# =========================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =========================================================
# Google Gemini - Chat
# =========================================================

spring.ai.google.genai.api-key=${GEMINI_API_KEY}

spring.ai.google.genai.chat.model=gemini-3.6-flash
# =========================================================
# Google Gemini - Embeddings
# =========================================================

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

spring.ai.google.genai.embedding.text.model=gemini-embedding-2

spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT

spring.ai.google.genai.embedding.text.dimensions=768

spring.ai.google.genai.embedding.text.auto-truncate=true

# =========================================================
# PGVector
# =========================================================

spring.ai.vectorstore.pgvector.index-type=HNSW

spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# Gemini text-embedding-004 produces 768-dimensional embeddings
spring.ai.vectorstore.pgvector.dimensions=768

# We will manage our database schema through Flyway
spring.ai.vectorstore.pgvector.initialize-schema=false

spring.ai.vectorstore.pgvector.max-document-batch-size=100

# =========================================================
# Actuator
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=always

# =========================================================
# Logging
# =========================================================

logging.level.root=INFO

logging.level.com.aryan=INFO

# =========================================================
# Server
# =========================================================

server.port=${SERVER_PORT:8080}

app.storage.root=storage

# =========================================================
# Retrieval
# =========================================================

app.retrieval.similarity-threshold=0.70