services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: document-qa-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: document_qa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Kolkata

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_qa"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: document-qa-app
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/document_qa
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Kolkata"

    ports:
      - "8080:8080"

volumes:
  postgres_data: